# 力企云 SaaS 前端伺服（新宿主机 120.79.142.141）
# 用轻量 nginx 伺服：PC 管理后台 frontend/dist + 惠企政策 H5 frontend-h5（零构建单页）
# 独立容器 liqi-nginx（--network host，仅 listen 5180，不占 80，避免撞 qczy-nginx）。
server {
    listen 5180;
    server_name _;
    root /usr/share/nginx/html;       # PC 管理后台 dist
    index index.html;
    client_max_body_size 50m;

    # 惠企政策 H5（移动端单页，hash 路由；资源走相对路径）
    location /h5/ {
        alias /usr/share/nginx/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # 后端 API：管理后台 admin-api
    location /admin-api/ {
        proxy_pass http://127.0.0.1:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 后端 API：惠企政策 H5 / 移动端 app-api
    location /app-api/ {
        proxy_pass http://127.0.0.1:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # MinIO 对象存储直链代理（桶 liqi-attachments）：报告/说明书等对外预览。
    # 走力企云「自有 8000 链路」(host 网络 → 127.0.0.1:9000)，不依赖启程 80 网关
    # qczy-nginx——该网关曾因缺 qczy-api-nginx 上游整容器崩溃、80 端口失联连坐本项目报告链接。
    # 对外直链：http://120.79.142.141:8000/liqi-attachments/<key>
    location /liqi-attachments/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # PC 管理后台 SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
